name: MERN CI Pipeline

# Trigger this pipeline on push to these branches
on:
  push:
    branches: [ "main", "devops-learning" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Quality Check (Linting & Dependencies)
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Node.js 20 (Same as your Dockerfile)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # Install Server Deps
      - name: Install Server Dependencies
        run: cd server && npm ci

      # Install Client Deps
      - name: Install Client Dependencies
        run: cd client && npm ci

      # Run Linting (Frontend + Backend)
      - name: Run Linting
        run: npm run lint

  # Job 2: Verify Docker Build (The Ultimate Test)
  docker-build-check:
    runs-on: ubuntu-latest
    needs: quality-check # Wait for Job 1 to pass
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Try building Server
      - name: Build Server Image
        run: docker build ./server -t test-server

      # Try building Client
      # This confirms your Case Sensitivity fixes work on Linux!
      - name: Build Client Image
        run: docker build ./client -t test-client
