name: MERN CI/CD Pipeline

on:
  push:
    branches: [ "main" ]  # Only deploy when pushing to main

jobs:
  # Job 1: Quality Check
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - run: cd server && npm ci
      - run: cd client && npm ci
      # - run: npm run lint  <-- Uncomment when you fix linting errors

  # Job 2: Build & Push to Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and Push Server
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          # REPLACE 'yourusername' below!
          tags: thisisjaymodi/resume-server:latest

      - name: Build and Push Client
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          # REPLACE 'yourusername' below!
          tags: thisisjaymodi/resume-client:latest
